# Fill this file locally. Do not paste it into chat, commit it, or include it in a prompt.
# Default location: ~/.lightnovel_translation/config.toml
schema_version = 1
# tokenizer_path = "tokenizers/tokenizer.json" # Relative to this file; requires [narrative].

[syosetu]
concurrency = 2 # Concurrent chapter prefetch, 1-8. Use 1 for serial downloads.
request_interval = 1.0 # Seconds between request starts, shared by all download workers.

[model]
model = "YOUR_MODEL"
base_url = "https://example.invalid/v1" # Replace with your actual compatible endpoint.
api_key = "" # Fill locally. Never send this value to the agent.
# Optional alternative when api_key is empty:
# api_key_env = "LIGHTNOVEL_TRANSLATION_API_KEY"
timeout = 600
retries = 0 # Persistent engine owns retry accounting.
thinking = "omit"

[capacity]
# Set the actual endpoint limits; these values do not detect the model's abilities.
# The workflow defaults below assume a large-context model; lower batch_size and
# output budgets together if your endpoint is smaller.
context_window_tokens = 1048576
max_output_tokens = 131072
token_inflation_factor = 1.05
safety_tokens = 2048

[workflow]
# Batch-source translation: chapters in a batch do not depend on each other's
# translations. A batch-wide glossary keeps names consistent.
translation_concurrency = 3
review_concurrency = 4
translation_mode = "batch" # "batch" or "pipelined".
pipeline_review_backlog = 2 # In pipelined mode, reviewed batches may lag behind translation.
pipeline_manual_backlog = 2 # Pending manual-review holds allowed before translation pauses.
adjudication_mode = "normal" # "normal" or "strict"; strict sends unresolved major findings to manual review.
batch_size = 30 # Must fit the endpoint context with preceding batch sources.
full_chapters = 5 # Recently accepted chapters included as full text.
history_chapters = 3 # Recent accepted chapters included in review evidence.
summary_every = 5 # Generate an incremental target summary every N chapters.
summary_lag = 0 # 0 keeps summaries current; do not combine a large lag with a sparse cadence.
reference_chunk = 16 # Chapters per reference summary/glossary request.
max_revisions = 2 # Confirmed critical/major findings trigger at most this many rewrites.
translation_tokens = 65536
review_tokens = 65536
adjudication_tokens = 32768
summary_tokens = 16384
glossary_tokens = 16384
# Glossary extraction uses @@TERM records and resumes after a truncated
# response. Per-chunk cap = per_chapter * effective chapters + base.
glossary_terms_per_chapter = 5
glossary_terms_base = 40
glossary_max_continuations = 4
# The first N glossary forms are an append-only prompt prefix shared across
# batches. Batch-only additions are appended later in the prompt. 0 disables
# the stable core.
prompt_glossary_limit = 512
# Historical term evidence is source-aligned and bounded. The excerpt radius is
# in characters; the global cap counts excerpt characters, not JSON overhead.
evidence_excerpt_chars = 120
evidence_max_excerpts = 2
evidence_max_chars = 12000
# Per-review native tool-call budgets. The review model may request prior
# chapters or term usages; the remaining budget is shown in its context.
lookup_chapters = 8
lookup_terms = 50
max_term_checks = 50 # Deterministic glossary mismatches sent to the reviewer.
max_tool_rounds = 4
