# Fill this file locally. Do not paste it into chat, commit it, or include it in a prompt.
# Default location: ~/.lightnovel_translation/config.toml
schema_version = 1
# tokenizer_path = "tokenizers/tokenizer.json" # Relative to this file; requires [narrative].

[model]
model = "YOUR_MODEL"
base_url = "https://example.invalid/v1" # Replace with your actual compatible endpoint.
api_key = "" # Fill locally. Never send this value to the agent.
# Optional alternative when api_key is empty:
# api_key_env = "LIGHTNOVEL_TRANSLATION_API_KEY"
timeout = 600
retries = 0 # Persistent engine owns retry accounting.
thinking = "omit"

[capacity]
# Set the actual endpoint limits; these values do not detect the model's abilities.
context_window_tokens = 131072
max_output_tokens = 16384
token_inflation_factor = 1.05
safety_tokens = 2048

[roles.translator]
requested_output_tokens = 8192
[roles.reviewer]
requested_output_tokens = 8192
[roles.adjudicator]
requested_output_tokens = 8192
[roles.indexer]
requested_output_tokens = 16384
[roles.compressor]
requested_output_tokens = 8192

[index]
parent_max_chapters = 100
child_max_chapters = 10
child_target_tokens = 64000
child_min_content_tokens = 4000

[sequence]
strategy = "H"
mode = "working"
n_chapter = 3
n_child = 2
compression_trigger = 0.85
compression_target = 0.65
max_revisions = 1
translation_tools = true
targeted_evidence = true
output_profile = "source-records-v1"

[references]
# Leave token budgets unset to derive them from capacity, output reserves and inflation.
# packet_token_budget = 96000
# terminology_input_tokens = 24000
style_max_documents = 3
style_excerpt_paragraphs = 48
terminology_max_terms = 16
# terminology_output_tokens = 16384 # Unset: use the indexer role's output allowance.
terminology_max_documents = 12
terminology_radius = 2
discover_terms = true

[limits]
# Separate persistent limits for every index and every translation job.
max_requests = 300
max_input_tokens = 20000000
max_output_tokens = 3000000
max_attempts = 3
