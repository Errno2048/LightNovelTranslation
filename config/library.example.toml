# Portable public-library configuration; credentials remain in the environment.
schema_version = 1
# tokenizer_path = "../tokenizers/tokenizer.json" # Requires the narrative extra.

[model]
model = "your-model"
base_url = "http://127.0.0.1:8000/v1"
api_key_env = "NOVELFETCH_LLM_API_KEY"
timeout = 600
retries = 0 # The persistent engine owns retry accounting.
thinking = "omit" # Also accepts true/false if supported by your endpoint.

[capacity]
# Declare the actual endpoint limits. No automatic model-capacity lookup.
context_window_tokens = 131072
max_output_tokens = 16384
token_inflation_factor = 1.05
safety_tokens = 2048

[roles.translator]
requested_output_tokens = 8192
[roles.reviewer]
requested_output_tokens = 8192
[roles.adjudicator]
requested_output_tokens = 8192
[roles.indexer]
requested_output_tokens = 16384
[roles.compressor]
requested_output_tokens = 8192

[index]
parent_max_chapters = 100
child_max_chapters = 10
child_target_tokens = 64000
child_min_content_tokens = 4000

[sequence]
strategy = "H"
mode = "working"
n_chapter = 3
n_child = 2
compression_trigger = 0.85
compression_target = 0.65
max_revisions = 1
translation_tools = true
targeted_evidence = true
output_profile = "source-records-v1"

[limits]
# Each index and each translation job has its own durable ledger.
max_requests = 300
max_input_tokens = 20000000
max_output_tokens = 3000000
max_attempts = 3
